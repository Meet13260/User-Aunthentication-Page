<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <title>User-Authentication Page</title>
    </head>
    <body>
    <main>
        <h1 id="heading">User-Authentication Form</h1>
        <form id="form">
            <h3 id="nam">
                Name:                  <input id="name" type="text" placeholder="Enter Name"><br>
            </h3>    
            <h3 id="mail">   
                Email-Id:              <input id="email" type="email"  placeholder="Enter Email-ID">
            </h3> 
            <h3 id="mobile">
                Phone:                 <input id="phone" type="text"  placeholder="Enter Phone Number">
            </h3>
            <h3 id="add">
                Address:                 <input id="address" type="text"  placeholder="Enter Address">
            </h3>

            <button onclick="register()" id="registerBtn" type="button">
                Register
            </button>
        </form>

        <script>

    async function register() {

      // Collect input values
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const phone = document.getElementById("phone").value;
      const address = document.getElementById("address").value;

      // Send data to backend
      const response = await fetch("http://127.0.0.1:5000/register", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          name: name,
          email: email,
          phone: phone,
          address: address
        })

      });

      // Receive response
      const data = await response.json();

      alert(data.message);
    }

</script>
</main>
</body>
    </html>
